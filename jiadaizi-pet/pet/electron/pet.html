<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>佳代子桌宠</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .pet {
    position: absolute;
    right: 18px;
    bottom: 10px;
    width: 163.2px;   /* 192 × 0.85 */
    height: 176.8px;  /* 208 × 0.85 */
    cursor: grab;
    touch-action: none;
  }
  .pet:active { cursor: grabbing; }
  .pet .sprite {
    position: absolute;
    inset: 0;
    background-image: url('/spritesheet.png');
    background-repeat: no-repeat;
    background-size: 1305.6px 1591.2px; /* W×8, H×9 */
    image-rendering: pixelated;
    transform-origin: 50% 92%;  /* 以脚底为轴 */
    will-change: transform;
  }
  .pet .shadow {
    position: absolute;
    left: 50%;
    bottom: -7px;
    width: 74px;
    height: 13px;
    margin-left: -37px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.4) 0%, rgba(0,0,0,0) 72%);
    opacity: .5;
    pointer-events: none;
  }
  .pet .bubble {
    position: absolute;
    left: 50%;
    bottom: 100%;
    margin-bottom: 12px;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.96);
    color: #333;
    border-radius: 12px;
    padding: 6px 12px;
    font-size: 13px;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    pointer-events: none;
    animation: bubblePop .22s ease-out;
    max-width: 220px;
    white-space: normal;
    line-height: 1.35;
    text-align: center;
  }
  .pet .bubble::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 7px solid transparent;
    border-top-color: rgba(255, 255, 255, 0.96);
  }
  /* 心情色气泡（在普通气泡类上加 mood 类） */
  .bubble.b-happy { background: rgba(255, 243, 205, 0.97); color: #5a4a1a; }
  .bubble.b-happy::after { border-top-color: rgba(255, 243, 205, 0.97); }
  .bubble.b-low { background: rgba(226, 232, 240, 0.96); color: #4a5568; }
  .bubble.b-low::after { border-top-color: rgba(226, 232, 240, 0.96); }
  /* 思考点点 */
  .dots { display: none; margin-left: 3px; vertical-align: 1px; }
  .dots.show { display: inline; }
  .dots i {
    display: inline-block;
    width: 4px; height: 4px;
    margin: 0 1.5px;
    border-radius: 50%;
    background: #5a7;
    opacity: .2;
    animation: dotBlink 1.5s infinite;
  }
  .dots i:nth-child(2) { animation-delay: .25s; }
  .dots i:nth-child(3) { animation-delay: .5s; }
  @keyframes dotBlink { 0%, 60%, 100% { opacity: .18; } 30% { opacity: 1; } }

  /* ============ 单帧形象（classic）的 CSS 动效 ============ */
  /* 双帧模式下这些动画不生效（m-multi 类跳过） */

  .pet.m-idle:not(.m-multi) .sprite { animation: idleBob 3.4s ease-in-out infinite; }
  .pet.m-idle:not(.m-multi) .shadow { animation: shadowFloat 3.4s ease-in-out infinite; }
  .pet.m-working:not(.m-multi) .sprite { animation: workType 1.15s ease-in-out infinite; }
  .pet.m-working:not(.m-multi) .shadow { animation: shadowPulse 1.15s ease-in-out infinite; }
  .pet.m-review:not(.m-multi) .sprite { animation: ponderBig 4.4s ease-in-out infinite; }
  .pet.m-review:not(.m-multi) .shadow { animation: shadowFloat 4.4s ease-in-out infinite; }
  .pet.m-waiting:not(.m-multi) .sprite { animation: waitHop 1.7s ease-in-out infinite; }
  .pet.m-waiting:not(.m-multi) .shadow { animation: shadowHop 1.7s ease-in-out infinite; }
  .pet.m-failed:not(.m-multi) .sprite { animation: droop 2.6s ease-in-out forwards; }
  .pet.m-failed:not(.m-multi) .shadow { animation: shadowDroop 2.6s ease-in-out forwards; }
  .pet.m-celebrating:not(.m-multi) .shadow { animation: shadowFloat 2.6s ease-in-out infinite; }
  .pet.dragging .sprite { animation: runBob .26s linear infinite; }
  .pet.dragging .shadow { animation: none; }
  /* 多帧形象（v2）：帧自带动画，shadow 加轻微呼吸 */
  .pet.m-multi .shadow { animation: shadowFloat 2.8s ease-in-out infinite; }
  .pet.m-multi.dragging .sprite { animation: none; }

  /* ============ 打盹（sleeping 渲染层视觉态，覆盖对应模式动画） ============ */
  .pet.sleeping:not(.m-multi) .sprite { animation: sleepBreath 5.4s ease-in-out infinite; filter: brightness(.86) saturate(.9); }
  .pet.sleeping:not(.m-multi) .shadow { animation: shadowSleep 5.4s ease-in-out infinite; }
  .pet.sleeping .bubble { opacity: .92; }

  /* ============ 心情氛围 ============ */
  .pet.mood-happy:not(.m-multi) .sprite { filter: brightness(1.05) saturate(1.1) drop-shadow(0 0 7px rgba(255, 205, 110, .38)); }
  .pet.mood-happy.m-multi .sprite { filter: brightness(1.04) saturate(1.08); }
  .pet.mood-low:not(.m-multi) .sprite { filter: brightness(.93) saturate(.82); }
  .pet.mood-low.m-multi .sprite { filter: brightness(.94) saturate(.86); }
  .pet.mood-happy.sleeping:not(.m-multi) .sprite { filter: brightness(.87) saturate(.92); }  /* 睡觉时心情光晕退让 */

  @keyframes idleBob {
    0%, 100% { transform: translateY(0) scaleY(1); }
    50%      { transform: translateY(-4px) scaleY(1.014); }
  }
  @keyframes workType {
    0%   { transform: translateY(0) rotate(0deg); }
    6%   { transform: translateY(-2.6px) rotate(1.5deg); }
    12%  { transform: translateY(-.6px)  rotate(.5deg); }
    18%  { transform: translateY(-2.4px) rotate(1.3deg); }
    24%  { transform: translateY(-.5px)  rotate(.4deg); }
    30%  { transform: translateY(-2px)   rotate(1.1deg); }
    38%, 100% { transform: translateY(0) rotate(0deg); }
  }
  @keyframes ponderBig {
    0%, 100% { transform: translateY(0) rotate(-3.4deg); }
    50%      { transform: translateY(-3.5px) rotate(3.4deg); }
  }
  @keyframes waitHop {
    0%, 62%, 100% { transform: translateY(0); }
    74%           { transform: translateY(-6px); }
    86%           { transform: translateY(-1px); }
  }
  @keyframes droop {
    0%   { transform: translateY(-2px) scale(1); }
    100% { transform: translateY(3px) scale(.982) rotate(1.6deg); }
  }
  @keyframes runBob {
    0%, 100% { transform: translateY(0) rotate(-1.2deg); }
    50%      { transform: translateY(-2.2px) rotate(1.2deg); }
  }
  @keyframes shadowFloat {
    0%, 100% { transform: scaleX(1);  opacity: .5; }
    50%      { transform: scaleX(.9); opacity: .36; }
  }
  @keyframes shadowPulse {
    0%, 38%, 100% { transform: scaleX(1); }
    10%, 24%      { transform: scaleX(.95); }
  }
  @keyframes shadowHop {
    0%, 62%, 100% { transform: scaleX(1); }
    74%           { transform: scaleX(.82); }
    86%           { transform: scaleX(.96); }
  }
  @keyframes shadowDroop {
    0%   { transform: scaleX(1);  opacity: .5; }
    100% { transform: scaleX(.95); opacity: .34; }
  }
  @keyframes sleepBreath {
    0%, 100% { transform: translateY(1.2px) scaleY(1); }
    50%      { transform: translateY(0) scaleY(1.011); }
  }
  @keyframes shadowSleep {
    0%, 100% { transform: scaleX(1);  opacity: .42; }
    50%      { transform: scaleX(.93); opacity: .3; }
  }
  @keyframes bubblePop {
    from { transform: translateX(-50%) scale(.86); opacity: .4; }
    to   { transform: translateX(-50%) scale(1);   opacity: 1; }
  }

  /* ============ 右键互动菜单 ============ */
  .menu {
    position: fixed;
    z-index: 99;
    background: rgba(26, 28, 38, .93);
    color: #eceef2;
    border-radius: 10px;
    padding: 5px;
    font-size: 12.5px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .5);
    backdrop-filter: blur(5px);
    min-width: 132px;
    border: 1px solid rgba(255, 255, 255, .08);
    animation: menuIn .14s ease-out;
  }
  .menu .mi { padding: 7px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
  .menu .mi:hover { background: rgba(255, 255, 255, .13); }
  .menu .mi .hint { color: #9aa3b2; font-size: 11px; margin-left: 6px; }
  .menu .sep { height: 1px; background: rgba(255, 255, 255, .1); margin: 4px 8px; }
  @keyframes menuIn { from { opacity: 0; transform: translateY(3px) scale(.97); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div class="pet" id="pet" title="佳代子 · 拖动移动 · 右键互动 · 托盘可切换形象">
    <div class="bubble" id="bubble"><span id="bubbleText">休息中~ 有事叫我</span><span class="dots" id="dots"><i></i><i></i><i></i></span></div>
    <div class="shadow" id="shadow"></div>
    <div class="sprite" id="sprite"></div>
  </div>
  <div class="menu" id="menu" hidden></div>

<script>
// =============================================================================

// 桌宠不挂 Harness、独立常驻。
// =============================================================================

    MODE_SEQ: { idle: 'idle', working: 'tool', review: 'review', waiting: 'waiting', failed: 'failed', celebrating: 'done' },
    TRICK_TRACK: { waving: 'waving', review: 'review', waiting: 'waiting', runRight: 'running-right', runLeft: 'running-left', idle: 'idle', yawn: 'waiting', glance: 'review', sway: 'waving' },
    TRICK_SEQ: { yawn: 'yawnish', glance: 'glancey', sway: 'waving' },
  },
}

const { CW, CH, SCALE } = CONFIG
const W = CW * SCALE, H = CH * SCALE

const pet = document.getElementById('pet')
const sprite = document.getElementById('sprite')
const shadow = document.getElementById('shadow')
const bubble = document.getElementById('bubble')
const bubbleText = document.getElementById('bubbleText')
const dotsEl = document.getElementById('dots')
const menuEl = document.getElementById('menu')

let skin = 'classic'        // 当前形象（localStorage 记忆，默认女仆装 classic）
let currentMode = null
let currentAnim = null
let celebrateTimer = null
let clickTimer = null
let idleTrickTimer = null
let rephraseTimer = null
let frameTimer = null       // v2 多帧推进
let frameGen = 0            // v2 帧代数守卫（防过期回调）
let seqPlayTimer = null     // v2 序列推进
let drag = null
let audioEl = null
const bubbleIdx = {}
let lastBubbleText = ''

// ---------- 富化状态 ----------
let mood = 0                // 心情 -100 ~ 100（localStorage 持久化）
let sleeping = false        // 渲染层打盹视觉态
let sleepTimer = null
let idleSince = Date.now()  // 最近一次进入 idle 的时间（自动打盹判据）
let petHeadActive = false   // 摸头互动中
let petHeadTimer = null
let petHeadHoldTimer = null // pointerdown 按住计时
let menuTimer = null        // 右键菜单自动收
let stareHoverTimer = null  // 悬停盯看计时
let lastStareAt = 0
let volume = 1.0            // 语音音量（localStorage 持久化）

// ---------- localStorage 读写 ----------
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v } catch { return d } }
function lsSet(k, v) { try { localStorage.setItem(k, v) } catch { /* noop */ } }

// ---------- 时段系统 ----------
function getSlot() {
  const h = new Date().getHours()
  for (const [name, spec] of Object.entries(CONFIG.TIME_SLOTS)) {
    if (spec.hours.includes(h)) return name
  }
  return 'day'
}
function isNight() { return getSlot() === 'lateNight' }
function trickDelay() {
  const base = CONFIG.IDLE_TRICK_MIN_MS + Math.random() * (CONFIG.IDLE_TRICK_MAX_MS - CONFIG.IDLE_TRICK_MIN_MS)
  return isNight() ? base * CONFIG.NIGHT_TRICK_SLOWDOWN : base
}

// ---------- 心情系统 ----------
function loadMood() {
  let m = parseInt(lsGet('jiadaizi-mood', '0'), 10)
  if (!Number.isFinite(m)) m = 0
  // 每天 4 点后首次见面时向 0 温和回归 20%（情绪会自然平复）
  const last = lsGet('jiadaizi-mood-date', '')
  const today = new Date().toDateString()
  if (last !== today) {
    if (new Date().getHours() >= 4) {
      m = Math.round(m * 0.8)
      if (Math.abs(m) < 3) m = 0
      lsSet('jiadaizi-mood-date', today)
    }
  }
  mood = Math.max(-100, Math.min(100, m))
  updateMoodClass()
}
function saveMood() { lsSet('jiadaizi-mood', String(mood)) }
function addMood(delta, reason) {
  const before = mood
  mood = Math.max(-100, Math.min(100, mood + delta))
  if (mood === before) return
  updateMoodClass()
  saveMood()
  // 跨档位时补一句小气泡（仅 idle 安静时）
  if (currentMode === 'idle' && !sleeping && !drag) {
    if (mood >= 40 && before < 40) sceneBubble('moodUp')
    else if (mood <= -40 && before > -40) sceneBubble('moodLow')
  }
}
function updateMoodClass() {
  pet.classList.toggle('mood-happy', mood >= 40)
  pet.classList.toggle('mood-low', mood <= -40)
}

// ---------- 气泡 ----------
function pickFromPool(pool, key) {
  if (!Array.isArray(pool) || pool.length === 0) return ''
  let idx = (bubbleIdx[key] ?? -1)
  for (let step = 1; step <= pool.length; step++) {
    const candidate = pool[(idx + step) % pool.length]
    if (candidate !== lastBubbleText) {
      bubbleIdx[key] = (idx + step) % pool.length
      lastBubbleText = candidate
      return candidate
    }
  }
  return pool[0]
}
function setBubble(text, withDots, bubbleCls) {
  bubbleText.textContent = text
  dotsEl.classList.toggle('show', !!withDots)
  bubble.classList.remove('b-happy', 'b-low')
  if (bubbleCls) bubble.classList.add(bubbleCls)
  bubble.style.animation = 'none'
  void bubble.offsetWidth
  bubble.style.animation = ''
}
function sceneBubble(key, withDots, bubbleCls) {
  const pool = CONFIG.BUBBLES[key] || []
  setBubble(pickFromPool(pool, key), withDots, bubbleCls)
}
// idle 气泡按心情分支 + 时段问候
function idleBubble(opts) {
  if (opts && opts.greet) {
    setBubble(pickFromPool(CONFIG.GREETS[getSlot()] || CONFIG.GREETS.day, 'greet-' + getSlot()))
    return
  }
  if (mood >= 40 && Math.random() < 0.55) { setBubble(pickFromPool(CONFIG.BUBBLES.idleHappy, 'idleHappy'), false, 'b-happy'); return }
  if (mood <= -40 && Math.random() < 0.55) { setBubble(pickFromPool(CONFIG.BUBBLES.idleLow, 'idleLow'), false, 'b-low'); return }
  sceneBubble('idle')
}

// ---------- 单帧形象（classic）：CSS transform 动效 + 单帧切换 ----------
function classicSetAnim(anim) {
  if (anim === currentAnim) return
  currentAnim = anim
  const spec = SKINS.classic.ROWS[anim] || SKINS.classic.ROWS.idle
  sprite.style.backgroundPosition = '0px ' + (-spec.row * H) + 'px'
}

// ---------- 多帧形象（v2）：JS 逐帧推进 + sequences 场景编排 ----------
function v2SetFrame(col, row) {
  sprite.style.backgroundPosition = (-col * W) + 'px ' + (-row * H) + 'px'
}
// 播放一个 track 的一遍（帧推进），播完回调
function v2PlayTrackOnce(name, done) {
  const gen = ++frameGen
  const track = SKINS.v2.tracks[name]
  if (!track) { if (done) done(); return }
  let i = 0
  const step = () => {
    if (gen !== frameGen) return
    v2SetFrame(i, track.row)
    i = (i + 1) % track.count
    const delay = track.durations[i] || 150
    frameTimer = setTimeout(step, delay)
    if (i === 0 && done) done()
  }
  step()
}
// 无限循环播放一个 track
function v2LoopTrack(name) {
  const gen = ++frameGen
  const track = SKINS.v2.tracks[name]
  if (!track) return
  let i = 0
  const step = () => {
    if (gen !== frameGen) return
    v2SetFrame(i, track.row)
    i = (i + 1) % track.count
    frameTimer = setTimeout(step, track.durations[i] || 150)
  }
  step()
}
// 循环播放一个场景序列（每 track 播完进下一个，播完循环）
function v2PlaySequence(name) {
  const gen = ++frameGen
  const seq = SKINS.v2.sequences[name]
  if (!seq) { v2LoopTrack('idle'); return }
  let idx = 0
  const playTrack = (trackName, next) => {
    const t = SKINS.v2.tracks[trackName]
    if (!t) { next(); return }
    let i = 0
    const step = () => {
      if (gen !== frameGen) return
      v2SetFrame(i, t.row)
      i = (i + 1) % t.count
      frameTimer = setTimeout(step, t.durations[i] || 150)
      if (i === 0) next()
    }
    step()
  }
  const loop = () => {
    if (gen !== frameGen) return
    const trackName = seq[idx % seq.length]
    idx++
    playTrack(trackName, loop)
  }
  loop()
}
// 一次性播放 N 轮序列（互动用），播完回到当前模式的常规动画
function v2PlaySequenceOnce(name, loops, done) {
  const gen = ++frameGen
  const seq = SKINS.v2.sequences[name]
  if (!seq) { if (done) done(); return }
  let round = 0, idx = 0
  const playTrack = (trackName, next) => {
    const t = SKINS.v2.tracks[trackName]
    if (!t) { next(); return }
    let i = 0
    const step = () => {
      if (gen !== frameGen) return
      v2SetFrame(i, t.row)
      i = (i + 1) % t.count
      frameTimer = setTimeout(step, t.durations[i] || 150)
      if (i === 0) next()
    }
    step()
  }
  const loop = () => {
    if (gen !== frameGen) return
    const trackName = seq[idx % seq.length]
    idx++
    if (idx % seq.length === 0) round++
    if (loops && round >= loops) { if (done) done(); return }
    playTrack(trackName, loop)
  }
  loop()
}
// 停止 v2 播放
function v2Stop() {
  frameGen++
  if (frameTimer) { clearTimeout(frameTimer); frameTimer = null }
}

// ---------- 形象切换 ----------
function applySkin(next, silent) {
  if (next !== 'classic' && next !== 'v2') return
  if (next === skin) return
  skin = next
  lsSet('jiadaizi-skin', skin)
  // 精灵图 + 模式类
  sprite.style.backgroundImage = 'url("' + SKINS[skin].spriteUrl + '")'
  pet.classList.toggle('m-multi', SKINS[skin].type === 'multi')
  // 重播当前状态
  if (currentMode) {
    stopAllPlayback()
    applyModeInternal(currentMode)
  }
  if (!silent && currentMode === 'idle' && !sleeping) setBubble(skin === 'v2' ? '（换上了蓝白裙~）' : '（换回女仆装啦）')
}
function stopAllPlayback() {
  v2Stop()
  if (celebrateTimer) { clearTimeout(celebrateTimer); celebrateTimer = null }
  if (clickTimer) { clearTimeout(clickTimer); clickTimer = null }
  if (petHeadTimer) { clearTimeout(petHeadTimer); petHeadTimer = null }
  // 注意：不清 idleTrickTimer（待机行为链自管理自续期）和 rephraseTimer（armRephrase 自管理）
}

// ---------- 状态应用 ----------
function setModeClass(m) {
  pet.className = 'pet m-' + m + (SKINS[skin].type === 'multi' ? ' m-multi' : '') + (drag ? ' dragging' : '')
  updateMoodClass()
  if (sleeping) pet.classList.add('sleeping')
}

function applyModeInternal(mode) {
  currentMode = mode
  setModeClass(mode)
  if (SKINS[skin].type === 'multi') {
    // v2：多帧动画
    if (mode === 'celebrating') {
      sceneBubble('celebrating', false, mood >= 40 ? 'b-happy' : (mood <= -30 ? 'b-low' : ''))
      v2PlaySequence('done')
      startCelebrating()
    } else {
      v2Stop()
      v2PlaySequence(SKINS.v2.MODE_SEQ[mode] || 'idle')
      if (mode === 'idle') idleBubble()
      else sceneBubble(mode, mode === 'review')
      armRephrase()
    }
  } else {
    // classic：单帧 + CSS transform
    if (mode === 'celebrating') {
      sceneBubble('celebrating', false, mood >= 40 ? 'b-happy' : (mood <= -30 ? 'b-low' : ''))
      classicCelebrate()
    } else {
      classicSetAnim(SKINS.classic.MODE_ANIM[mode] || 'idle')
      if (mode === 'idle') idleBubble()
      else sceneBubble(mode, mode === 'review')
      armRephrase()
    }
  }
}

function applyMode(mode) {
  if (mode === currentMode && !sleeping) return
  if (sleeping) wakeUp('mode')
  stopAllPlayback()
  applyModeInternal(mode)
  // 进入 idle 时记时（自动打盹判据）
  if (mode === 'idle') {
    idleSince = Date.now()
    maybeSlotGreet()
  }
}

// 时段问候：每天每个时段第一次进 idle 时说一句（防刷屏）
function maybeSlotGreet() {
  try {
    const slot = getSlot()
    const key = new Date().toDateString() + '|' + slot
    const last = localStorage.getItem('jiadaizi-greet')
    if (last !== key) {
      localStorage.setItem('jiadaizi-greet', key)
      if (!sleeping && currentMode === 'idle' && !drag) {
        setBubble(pickFromPool(CONFIG.GREETS[slot] || CONFIG.GREETS.day, 'greet-' + slot))
      }
    }
  } catch { /* noop */ }
}

// ---------- 长场景自动换句 ----------
function armRephrase() {
  clearTimeout(rephraseTimer)
  if (currentMode !== 'working' && currentMode !== 'review' && currentMode !== 'waiting') return
  rephraseTimer = setTimeout(() => {
    if (drag || sleeping || currentMode === 'failed' || currentMode === 'celebrating') return
    if (currentMode === 'working' || currentMode === 'review' || currentMode === 'waiting') {
      sceneBubble(currentMode, currentMode === 'review')
    }
    armRephrase()
  }, CONFIG.REPHRASE_MS)
}

// ---------- 打盹（sleeping） ----------
function enterSleep(auto) {
  if (sleeping || drag || currentMode === 'celebrating' || currentMode === 'failed') return
  if (currentMode !== 'idle') return
  sleeping = true
  pet.classList.add('sleeping')
  clearTimeout(sleepTimer)
  sleepTimer = setTimeout(() => {
    if (sleeping) wakeUp('timer')
  }, CONFIG.SLEEP_MANUAL_MS)
  if (SKINS[skin].type === 'multi') {
    v2Stop()
    v2LoopTrack('sleep')
  }
  setBubble(pickFromPool(CONFIG.BUBBLES.sleeping, 'sleeping'))
  if (auto) idleSince = Date.now()  // 自动打盹后计时重置链
}
function wakeUp(reason) {
  if (!sleeping) return
  sleeping = false
  pet.classList.remove('sleeping')
  clearTimeout(sleepTimer)
  if (SKINS[skin].type === 'multi') {
    v2Stop()
    v2PlaySequence(SKINS.v2.MODE_SEQ[currentMode] || 'idle')
  }
  if (currentMode === 'idle') {
    if (reason === 'interact' || reason === 'peek') {
      const wakePool = [CONFIG.BUBBLES.wakeup[0], CONFIG.BUBBLES.wakeup[1], CONFIG.BUBBLES.wakeup[2]]
      setBubble(pickFromPool(wakePool, 'wakeup'))
      if (clickTimer) clearTimeout(clickTimer)
      clickTimer = setTimeout(() => { if (currentMode === 'idle' && !sleeping) idleBubble() }, 3200)
    } else {
      idleBubble()
    }
  }
  idleSince = Date.now()
}
// 自动打盹巡检（idle 太久没人理就自己睡）
setInterval(() => {
  if (!sleeping && currentMode === 'idle' && !drag && Date.now() - idleSince > CONFIG.SLEEP_AFTER_IDLE_MS) {
    enterSleep(true)
  }
}, 5000)

// ---------- 庆祝（classic 用 WAAPI；v2 用 done 序列 + 语音撒花） ----------
function confetti(n) {
  const colors = ['#ff8fb1', '#8fd2ff', '#ffe38f', '#a5f0c0', '#d5b3ff', '#ffb37a']
  const pr = pet.getBoundingClientRect()
  const ox = pr.left + pr.width * 0.5
  const oy = pr.top + 24
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div')
    const size = 4 + Math.random() * 4.5
    el.style.cssText =
      'position:absolute;left:' + ox + 'px;top:' + oy + 'px;' +
      'width:' + size + 'px;height:' + (size * (Math.random() > .5 ? 1 : .6)) + 'px;' +
      'background:' + colors[i % colors.length] + ';' +
      'border-radius:' + (Math.random() > .5 ? '50%' : '2px') + ';' +
      'pointer-events:none;z-index:9;'
    document.body.appendChild(el)
    const ang = -Math.PI / 2 + (Math.random() - .5) * 1.9
    const v = 55 + Math.random() * 50
    const dx = Math.cos(ang) * v
    const dy = Math.sin(ang) * v + 62 + Math.random() * 26
    el.animate(
      [
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) rotate(' + ((Math.random() - .5) * 540) + 'deg)', opacity: 0 },
      ],
      { duration: 850 + Math.random() * 500, easing: 'cubic-bezier(.2,.5,.6,1)' }
    ).onfinish = () => el.remove()
  }
}

function playVoice() {
  if (!audioEl) audioEl = new Audio()
  audioEl.src = CONFIG.VOICES[Math.floor(Math.random() * CONFIG.VOICES.length)]
  // 深夜轻一点，不吵人
  audioEl.volume = Math.max(0.1, Math.min(1, volume * (isNight() ? 0.5 : 1)))
  audioEl.currentTime = 0
  audioEl.play().catch(() => {})
}

// classic 庆祝：跳/挥交替（WAAPI）
function jumpOnce() {
  sprite.animate(
    [
      { transform: 'translateY(0) scale(1,1)' },
      { transform: 'translateY(-4px) scale(.95,1.06)', offset: .16 },
      { transform: 'translateY(-22px) scale(.96,1.05)', offset: .5 },
      { transform: 'translateY(0) scale(1.1,.88)', offset: .84 },
      { transform: 'translateY(0) scale(1,1)' },
    ],
    { duration: 660, easing: 'cubic-bezier(.3,.6,.4,1)' }
  )
  shadow.animate(
    [
      { transform: 'scaleX(1)', opacity: .5 },
      { transform: 'scaleX(.6)', opacity: .2, offset: .5 },
      { transform: 'scaleX(1.06)', opacity: .56, offset: .84 },
      { transform: 'scaleX(1)', opacity: .5 },
    ],
    { duration: 660 }
  )
}
function rockOnce() {
  sprite.animate(
    [
      { transform: 'rotate(0deg) translateY(0)' },
      { transform: 'rotate(-5deg) translateY(-3px)', offset: .3 },
      { transform: 'rotate(4deg) translateY(-1px)', offset: .68 },
      { transform: 'rotate(0deg) translateY(0)' },
    ],
    { duration: 880, easing: 'ease-in-out' }
  )
}
function classicCelebrate() {
  playVoice()
  confetti(isNight() ? 8 : 16)
  addMood(4, 'celebrate')
  let beatCount = 0
  const beat = () => {
    beatCount++
    const isJump = beatCount % 2 === 1
    classicSetAnim(isJump ? 'jump' : 'wave')
    if (isJump) {
      jumpOnce()
      if (beatCount % 4 === 1) confetti(isNight() ? 5 : 9)
      celebrateTimer = setTimeout(beat, 700)
    } else {
      rockOnce()
      celebrateTimer = setTimeout(beat, 940)
    }
  }
  beat()
}
// v2 庆祝：done 序列已在 applyModeInternal 启动，这里补语音 + 撒花
function startCelebrating() {
  playVoice()
  confetti(isNight() ? 8 : 16)
  addMood(4, 'celebrate')
  // 撒花节奏：每 1.2s 补一波（直到 mode 离开 celebrating）
  const sprinkle = () => {
    if (currentMode !== 'celebrating') return
    confetti(isNight() ? 5 : 9)
    celebrateTimer = setTimeout(sprinkle, 1200)
  }
  celebrateTimer = setTimeout(sprinkle, 1200)
}

// ---------- 状态同步 ----------
if (window.petEvents) {
  window.petEvents.onMode((m) => { if (m) applyMode(String(m)) })
  window.petEvents.onSkin && window.petEvents.onSkin((s) => { if (s) applySkin(String(s), true) })
}
if (window.petWindow && window.petWindow.onWake) {
  // 被「去睡会儿」隐藏后自动回来 / 托盘唤回
  window.petWindow.onWake(() => { if (sleeping) return; setBubble(pickFromPool(['回来啦~', '（冒头）我在！', '睡饱了，精神满满'], 'wakeHook'), false, 'b-happy'); clickTimer = setTimeout(() => { if (currentMode === 'idle' && !sleeping) idleBubble() }, 3000) })
}
async function sync() {
  try {
    const resp = await fetch('/jiadaizi-pet/state')
    const s = await resp.json()
    if (s && s.mode) applyMode(String(s.mode))
  } catch (e) { /* retry next tick */ }
}

// ---------- 待机行为链（双形象共用权重，动画各自实现） ----------
function chainWeights() {
  const s = Math.max(-100, Math.min(100, mood))
  return CONFIG.IDLE_CHAIN.map((it) => {
    let w = it.w
    if (s > 30 && (it.track === 'waving' || it.track === 'sway')) w *= 1.7    // 开心爱打招呼爱摇摆
    if (s < -30 && (it.track === 'review' || it.track === 'waiting' || it.track === 'glance')) w *= 1.7  // 低落爱发呆沉思
    return { ...it, w }
  })
}
function pickWeighted() {
  const list = chainWeights()
  const total = list.reduce((s, it) => s + it.w, 0)
  let roll = Math.random() * total
  for (const it of list) {
    roll -= it.w
    if (roll <= 0) return it
  }
  return list[0]
}
function playTrick(trick) {
  setBubble(trick.bubble, false, trick.bubbleCls || '')
  if (SKINS[skin].type === 'multi') {
    v2Stop()
    if (SKINS.v2.TRICK_SEQ[trick.track]) {
      v2PlaySequence(SKINS.v2.TRICK_SEQ[trick.track])
    } else {
      v2LoopTrack(SKINS.v2.TRICK_TRACK[trick.track] || 'idle')
    }
  } else {
    classicSetAnim(SKINS.classic.TRICK_ANIM[trick.track] || 'idle')
  }
  setTimeout(() => {
    if (currentMode === 'idle' && !drag && !sleeping) {
      if (trick.combo && Math.random() < CONFIG.COMBO_CHANCE && !isNight()) {
        playTrick(CONFIG.IDLE_CHAIN.find((it) => it.track === trick.combo) || trick)
      } else {
        // 回待机（按形象各自恢复）
        if (SKINS[skin].type === 'multi') {
          v2LoopTrack('idle')
        } else {
          v2Stop()
          classicSetAnim('idle')
        }
        idleBubble()
      }
    }
  }, trick.hold)
}
function scheduleIdleTrick() {
  if (idleTrickTimer) clearTimeout(idleTrickTimer)
  idleTrickTimer = setTimeout(() => {
    if (currentMode === 'idle' && !drag && !sleeping) {
      // 小概率直接吐一句心事（不配动作），让相处更有实感
      if (Math.random() < 0.12 && mood !== 0) {
        const poolSel = mood > 0 ? CONFIG.BUBBLES.moodUp : CONFIG.BUBBLES.moodLow
        setBubble(pickFromPool(poolSel, 'mood'), false, mood > 0 ? 'b-happy' : 'b-low')
        setTimeout(() => { if (currentMode === 'idle' && !drag && !sleeping) idleBubble() }, 3200)
      } else {
        playTrick(pickWeighted())
      }
    }
    scheduleIdleTrick()
  }, trickDelay())
}

// ---------- 互动：摸摸头 / 双击 / 悬停盯看 ----------
function startPetHead() {
  if (petHeadActive || sleeping) return
  petHeadActive = true
  if (SKINS[skin].type === 'multi') {
    v2Stop()
    v2PlaySequence('soothe')
  } else {
    classicSetAnim('waiting')
    petHeadSway()
  }
  setBubble(pickFromPool(CONFIG.BUBBLES.petHead, 'petHead'), false, 'b-happy')
  clearTimeout(petHeadTimer)
  petHeadTimer = setTimeout(endPetHead, CONFIG.PETHEAD_SESSION_MS)
}
function petHeadSway() {
  sprite.animate(
    [
      { transform: 'rotate(0deg) translateY(0)' },
      { transform: 'rotate(-2.6deg) translateY(-1.5px)', offset: .22 },
      { transform: 'rotate(2deg) translateY(0)', offset: .55 },
      { transform: 'rotate(-1.4deg) translateY(-1px)', offset: .8 },
      { transform: 'rotate(0deg) translateY(0)' },
    ],
    { duration: 1100, easing: 'ease-in-out' }
  )
}
function endPetHead() {
  if (!petHeadActive) return
  petHeadActive = false
  clearTimeout(petHeadTimer)
  addMood(6, 'pethead')
  if (currentMode === 'idle' && !sleeping && !drag) {
    restoreAnim()
    idleBubble()
  }
}
function doDoubleClick() {
  if (sleeping) { wakeUp('interact'); return }
  addMood(2, 'dbl')
  v2Stop()
  if (SKINS[skin].type === 'multi') {
    v2PlaySequenceOnce('surprised', 2, () => { if (currentMode === 'idle' && !sleeping && !drag) { v2Stop(); v2PlaySequence('idle') } })
  } else {
    classicSetAnim('jump')
    surprisePop()
    setTimeout(() => { if (currentMode === 'idle' && !sleeping && !drag) { classicSetAnim('idle'); idleBubble() } }, 900)
  }
  setBubble(pickFromPool(CONFIG.BUBBLES.dbl, 'dbl'))
  if (clickTimer) clearTimeout(clickTimer)
  clickTimer = setTimeout(() => { if (currentMode === 'idle' && !drag && !sleeping) idleBubble() }, 2600)
}
function surprisePop() {
  sprite.animate(
    [
      { transform: 'translateY(0) scale(1)' },
      { transform: 'translateY(-8px) scale(1.05,.95)', offset: .35 },
      { transform: 'translateY(-13px) scale(.94,1.09)', offset: .55 },
      { transform: 'translateY(0) scale(1.05,.95)', offset: .8 },
      { transform: 'translateY(0) scale(1)' },
    ],
    { duration: 560, easing: 'cubic-bezier(.3,.6,.4,1)' }
  )
}
function maybeStare() {
  const now = Date.now()
  if (sleeping || drag || petHeadActive) return
  if (now - lastStareAt < CONFIG.STARE_COOLDOWN_MS) return
  if (currentMode !== 'idle') return
  lastStareAt = now
  setBubble(pickFromPool(CONFIG.BUBBLES.stare, 'stare'))
  if (SKINS[skin].type === 'multi') {
    v2Stop()
    v2PlaySequence('waiting')
  }
  if (clickTimer) clearTimeout(clickTimer)
  clickTimer = setTimeout(() => { if (currentMode === 'idle' && !sleeping && !drag) { v2Stop(); v2PlaySequence(SKINS.v2.MODE_SEQ.idle || 'idle'); idleBubble() } }, 2600)
}

// ---------- 右键菜单 ----------
const MENU_ITEMS = [
  { act: 'pet', label: '摸摸头' },
  { act: 'poke', label: '戳一戳' },
  { act: 'sleep', label: '打个盹', hint: '30s' },
  { act: 'hide', label: '去睡会儿', hint: '藏 60s' },
  { type: 'sep' },
  { act: 'skin', label: '切换形象', hint: () => skin === 'v2' ? '→ 女仆装' : '→ 蓝白裙' },
  { act: 'vol', label: '音量', hint: () => { const pct = Math.round(volume * 100); return pct + '%（点按切换）' } },
]
function openMenu(x, y) {
  closeMenu()
  menuEl.hidden = false
  menuEl.innerHTML = ''
  for (const it of MENU_ITEMS) {
    if (it.type === 'sep') { const d = document.createElement('div'); d.className = 'sep'; menuEl.appendChild(d); continue }
    const mi = document.createElement('div')
    mi.className = 'mi'
    const hint = typeof it.hint === 'function' ? it.hint() : (it.hint || '')
    mi.innerHTML = it.label + (hint ? '<span class="hint">' + hint + '</span>' : '')
    mi.addEventListener('click', () => { menuAction(it.act); closeMenu() })
    menuEl.appendChild(mi)
  }
  // 定位：优先鼠标处，出界则收进窗口
  const bw = menuEl.offsetWidth || 140
  const bh = menuEl.offsetHeight || 180
  const mw = window.innerWidth, mh = window.innerHeight
  const mx = Math.min(Math.max(4, x), mw - bw - 4)
  const my = Math.min(Math.max(4, y), mh - bh - 4)
  menuEl.style.left = mx + 'px'
  menuEl.style.top = my + 'px'
  clearTimeout(menuTimer)
  menuTimer = setTimeout(closeMenu, 3500)
}
function closeMenu() {
  menuEl.hidden = true
  menuEl.innerHTML = ''
  if (menuTimer) { clearTimeout(menuTimer); menuTimer = null }
}
function menuAction(act) {
  switch (act) {
    case 'pet':
      if (!petHeadActive) startPetHead()
      break
    case 'poke':
      if (sleeping) wakeUp('interact')
      else {
        v2Stop()
        if (SKINS[skin].type === 'multi') v2PlaySequenceOnce('surprised', 1, () => { if (currentMode === 'idle' && !sleeping) { v2Stop(); v2PlaySequence('idle') } })
        else { classicSetAnim('jump'); surprisePop(); setTimeout(() => { if (currentMode === 'idle' && !sleeping) classicSetAnim('idle') }, 800) }
        setBubble(pickFromPool(CONFIG.BUBBLES.poke, 'poke'))
        if (clickTimer) clearTimeout(clickTimer)
        clickTimer = setTimeout(() => { if (currentMode === 'idle' && !drag && !sleeping) idleBubble() }, 2400)
      }
      break
    case 'sleep':
      enterSleep(false)
      break
    case 'hide':
      if (window.petWindow) window.petWindow.hide(60 * 1000)
      break
    case 'skin':
      applySkin(skin === 'v2' ? 'classic' : 'v2')
      break
    case 'vol':
      volume = volume > 0.6 ? 0.3 : 1.0
      lsSet('jiadaizi-vol', String(volume))
      setBubble('音量 ' + Math.round(volume * 100) + '%')
      if (clickTimer) clearTimeout(clickTimer)
      clickTimer = setTimeout(() => { if (currentMode === 'idle' && !drag && !sleeping) idleBubble() }, 1800)
      break
  }
}

// ---------- 入场 ----------
pet.animate(
  [
    { transform: 'translateY(14px) scale(.9)', opacity: 0 },
    { transform: 'translateY(0) scale(1)',     opacity: 1 },
  ],
  { duration: 420, easing: 'cubic-bezier(.2,.8,.3,1)' }
)

// ---------- 初始化 ----------
loadMood()
try {
  const saved = lsGet('jiadaizi-skin', 'classic')
  if (saved === 'classic' || saved === 'v2') skin = saved
} catch (e) { /* noop */ }
try { const v = parseFloat(lsGet('jiadaizi-vol', '1')); if (Number.isFinite(v)) volume = Math.max(0.1, Math.min(1, v)) } catch (e) { /* noop */ }
sprite.style.backgroundImage = 'url("' + SKINS[skin].spriteUrl + '")'
pet.classList.toggle('m-multi', SKINS[skin].type === 'multi')

applyMode('idle')
scheduleIdleTrick()
sync()
setInterval(sync, 2000)

// ---------- 拖动 / 点击 / 悬停 / 右键 ----------
function restoreAnim() {
  v2Stop()
  if (SKINS[skin].type === 'multi') {
    v2PlaySequence(SKINS.v2.MODE_SEQ[currentMode] || 'idle')
  } else {
    classicSetAnim(SKINS.classic.MODE_ANIM[currentMode] || 'idle')
  }
  if (currentMode === 'idle') idleBubble()
  else sceneBubble(currentMode, currentMode === 'review')
  armRephrase()
}
pet.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return
  closeMenu()
  if (sleeping) wakeUp('interact')
  if (petHeadActive) { endPetHead() }
  drag = { x: e.screenX, y: e.screenY, moved: false, downAt: Date.now() }
  try { pet.setPointerCapture(e.pointerId) } catch (err) { /* ignore */ }
  // 按住不动 500ms → 摸摸头（未移动的前提下）
  clearTimeout(petHeadHoldTimer)
  petHeadHoldTimer = setTimeout(() => {
    if (drag && !drag.moved && !petHeadActive && !sleeping) {
      startPetHead()
      drag.petHeadStarted = true
    }
  }, CONFIG.PETHEAD_HOLD_MS)
})
pet.addEventListener('pointermove', (e) => {
  if (!drag) return
  const dx = e.screenX - drag.x
  const dy = e.screenY - drag.y
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
    drag.moved = true
    if (drag.petHeadStarted) { /* 摸头中移动 → 放弃摸头 */ endPetHead() }
    clearTimeout(petHeadHoldTimer)
  }
  if (drag.moved) {
    pet.classList.add('dragging')
    if (SKINS[skin].type === 'multi') {
      v2Stop()
      v2LoopTrack(dx > 3 ? 'running-right' : 'running-left')
    } else {
      classicSetAnim(dx > 3 ? 'runRight' : 'runLeft')
    }
    if (bubbleText.textContent !== '呜哇~ 别拽我！' && bubbleText.textContent !== '（被拖着走）要掉啦要掉啦！') {
      setBubble(pickFromPool(CONFIG.BUBBLES.dragResist, 'drag'))
    }
  }
  if (window.petDrag) window.petDrag.move(dx, dy)
  drag.x = e.screenX
  drag.y = e.screenY
})
const endDrag = () => {
  clearTimeout(petHeadHoldTimer)
  const d = drag
  drag = null
  pet.classList.remove('dragging')
  if (window.petDrag && window.petDrag.moveEnd) window.petDrag.moveEnd()  // 记住落点
  if (petHeadActive) { /* 摸头结束单独处理（不当作点击） */ endPetHead(); return }
  if (d && !d.moved) {
    // 点击：挥手互动
    v2Stop()
    if (SKINS[skin].type === 'multi') {
      v2LoopTrack('waving')
    } else {
      classicSetAnim('wave')
      rockOnce()
    }
    setBubble(pickFromPool(CONFIG.BUBBLES.poke, 'poke'))
    if (clickTimer) clearTimeout(clickTimer)
    clickTimer = setTimeout(restoreAnim, CONFIG.CLICK_REACTION_MS)
  } else {
    restoreAnim()
  }
}
pet.addEventListener('pointerup', endDrag)
pet.addEventListener('pointercancel', endDrag)
// 双击惊喜
pet.addEventListener('dblclick', (e) => { e.preventDefault(); doDoubleClick() })
// 右键菜单
pet.addEventListener('contextmenu', (e) => {
  e.preventDefault()
  if (e.clientX !== undefined) openMenu(e.clientX, e.clientY)
})
// 悬停盯看：鼠标在桌宠窗口内停留一会，她会看你
pet.addEventListener('mousemove', () => {
  if (sleeping || drag || petHeadActive) return
  clearTimeout(stareHoverTimer)
  stareHoverTimer = setTimeout(() => { if (currentMode === 'idle' && !drag && !sleeping && !petHeadActive) maybeStare() }, CONFIG.STARE_HOVER_MS)
})
pet.addEventListener('mouseleave', () => { clearTimeout(stareHoverTimer) })
// 全局点击收菜单
document.addEventListener('pointerdown', (e) => { if (!menuEl.contains(e.target)) closeMenu() }, true)
</script>
</body>
